<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 90" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="rexlify-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="35%" stop-color="#f43f5e" />
      <stop offset="75%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
  </defs>

  <!-- Pixel Matrix Dispersion Effect on Top-Left of 'R' -->
  <g id="PixelMatrix">
    <rect x="2" y="24" width="4.5" height="4.5" fill="url(#rexlify-grad)" opacity="0.95" rx="0.5" />
    <rect x="9" y="15" width="5.5" height="5.5" fill="url(#rexlify-grad)" opacity="0.9" rx="0.5" />
    <rect x="17" y="23" width="4" height="4" fill="url(#rexlify-grad)" opacity="0.85" rx="0.5" />
    <rect x="9" y="29" width="3.5" height="3.5" fill="url(#rexlify-grad)" opacity="0.8" rx="0.5" />
    <rect x="23" y="11" width="6.5" height="6.5" fill="url(#rexlify-grad)" opacity="1" rx="0.5" />
    <rect x="17" y="33" width="4.5" height="4.5" fill="url(#rexlify-grad)" opacity="0.9" rx="0.5" />
    <rect x="25" y="22" width="6" height="6" fill="url(#rexlify-grad)" opacity="1" rx="0.5" />
    <rect x="33" y="16" width="5.5" height="5.5" fill="url(#rexlify-grad)" opacity="0.95" rx="0.5" />
    <rect x="30" y="31" width="4.5" height="4.5" fill="url(#rexlify-grad)" opacity="0.85" rx="0.5" />
    <rect x="37" y="24" width="5" height="5" fill="url(#rexlify-grad)" opacity="0.95" rx="0.5" />
  </g>

  <!-- Stylized Brand 'R' (Upper Arch & Lower Hook) -->
  <g id="Brand-R">
    <!-- Top arch & curved right leg -->
    <path 
      d="M 44 26 C 44 26 56 16 72 16 C 85 16 93 25 93 36 C 93 48 88 56 88 66 H 76 C 76 58 80 47 80 37 C 80 27 73 25 64 25 C 55 25 44 32 44 32 Z" 
      fill="url(#rexlify-grad)" 
    />
    <!-- Lower-left stem & horizontal waist -->
    <path 
      d="M 44 66 V 44 C 44 44 54 44 68 44 V 53 C 58 53 54 53 54 57 V 66 H 44 Z" 
      fill="url(#rexlify-grad)" 
    />
  </g>

  <!-- Crisp Wordmark "EXLIF" -->
  <g fill="currentColor" class="rexlify-text-body">
    <!-- E -->
    <path d="M 100 66 V 18 H 126 V 26 H 110 V 37 H 124 V 45 H 110 V 58 H 127 V 66 H 100 Z" />
    <!-- X -->
    <path d="M 132 66 L 144 42 L 133 18 H 144 L 150 34 L 157 18 H 167 L 155 42 L 168 66 H 157 L 150 49 L 142 66 H 132 Z" />
    <!-- L -->
    <path d="M 173 66 V 18 H 183 V 58 H 200 V 66 H 173 Z" />
    <!-- I -->
    <path d="M 207 66 V 18 H 217 V 66 H 207 Z" />
    <!-- F -->
    <path d="M 224 66 V 18 H 249 V 26 H 234 V 37 H 247 V 45 H 234 V 66 H 224 Z" />
  </g>

  <!-- Stylized Gradient 'Y' -->
  <path 
    d="M 254 18 L 265 40 V 66 H 275 V 40 L 286 18 H 275 L 270 32 L 264 18 H 254 Z" 
    fill="url(#rexlify-grad)" 
  />

  <!-- Trailing Chevron '>' -->
  <path 
    d="M 293 22 L 309 42 L 293 62 L 299 66 L 317 42 L 299 18 L 293 22 Z" 
    fill="url(#rexlify-grad)" 
  />

  <!-- Bottom Horizontal Accent Line -->
  <rect x="4" y="76" width="314" height="6" rx="3" fill="url(#rexlify-grad)" />
</svg>
